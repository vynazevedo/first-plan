name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  rust:
    name: cargo fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
      - name: cargo fmt
        run: cargo fmt --all -- --check
        working-directory: engine
      - name: cargo clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings
        working-directory: engine

  json:
    name: validate JSON files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: validate
        run: |
          set -e
          for f in $(find . -name "*.json" -not -path "./engine/target/*" -not -path "./.git/*"); do
            python3 -c "import json,sys; json.load(open('$f'))" || { echo "invalid: $f"; exit 1; }
          done
          echo "all JSON files valid"

  hooks:
    name: bash hooks shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: shellcheck
        run: find hooks -name "*.sh" -exec shellcheck {} +

  frontmatter:
    name: validate skill/agent/command frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: install pyyaml
        run: pip install pyyaml
      - name: validate frontmatter
        run: python3 tools/validate_frontmatter.py

  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_release.py
