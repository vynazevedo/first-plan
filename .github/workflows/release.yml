name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
  lint:
    uses: ./.github/workflows/lint.yml
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/check_release.py --tag "$GITHUB_REF_NAME"
  build:
    name: build ${{ matrix.target }}${{ matrix.suffix }}
    needs: [test, lint, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default builds (lean, ~1MB, no ML)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            features: ""
            suffix: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            features: ""
            suffix: ""
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            cross: false
            features: ""
            suffix: ""
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
            features: ""
            suffix: ""
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            cross: false
            features: ""
            suffix: ""
          # ML build (with embeddings, ~50MB, opt-in)
          # Linux x86_64 GNU only - musl + ONNX is fragile, postpone to v0.4.2.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
            features: "--features=ml"
            suffix: "-ml"
          # Tree-sitter AST build (~10MB, opt-in, precise extraction for 5 langs)
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            cross: true
            features: "--features=tree-sitter"
            suffix: "-ast"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine -> target
          key: ${{ matrix.target }}

      - name: install cross (linux musl)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 99b8069c

      - name: build (cross)
        if: matrix.cross
        working-directory: engine
        run: cross build --release --locked --target ${{ matrix.target }} --bin fpe --bin first-plan-engine ${{ matrix.features }}

      - name: build (cargo)
        if: ${{ !matrix.cross }}
        working-directory: engine
        run: cargo build --release --locked --target ${{ matrix.target }} --bin fpe --bin first-plan-engine ${{ matrix.features }}

      - name: smoke test native binary
        if: ${{ matrix.target != 'aarch64-unknown-linux-musl' }}
        shell: bash
        run: |
          engine/target/${{ matrix.target }}/release/fpe --version
          engine/target/${{ matrix.target }}/release/first-plan-engine --version
          engine/target/${{ matrix.target }}/release/fpe context --help

      - name: package (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        working-directory: engine/target/${{ matrix.target }}/release
        run: |
          tar czf "../../../../first-plan-engine-${{ matrix.target }}${{ matrix.suffix }}.tar.gz" fpe first-plan-engine

      - name: package (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        working-directory: engine/target/${{ matrix.target }}/release
        run: |
          Compress-Archive -Path fpe.exe,first-plan-engine.exe -DestinationPath ../../../../first-plan-engine-${{ matrix.target }}${{ matrix.suffix }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}${{ matrix.suffix }}
          path: |
            first-plan-engine-${{ matrix.target }}${{ matrix.suffix }}.tar.gz
            first-plan-engine-${{ matrix.target }}${{ matrix.suffix }}.zip
          if-no-files-found: error

  release:
    name: publish release
    permissions:
      contents: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: checksums and release notes
        shell: bash
        run: |
          python3 tools/check_release.py --tag "$GITHUB_REF_NAME" --notes dist/RELEASE_NOTES.md
          cd dist
          sha256sum first-plan-engine-*.tar.gz first-plan-engine-*.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/first-plan-engine-*.tar.gz
            dist/first-plan-engine-*.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body_path: dist/RELEASE_NOTES.md
